[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom-ext-openmc"
version = "0.2.0"
description = "OpenMC physics-code extension for the Axiom platform — Monte Carlo adapter, grading library, and the skills that call it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "The University of Texas at Austin" },
    { name = "B-Tree Labs", email = "engineering@b-tree-labs.dev" },
]
keywords = ["axiom", "openmc", "monte-carlo", "neutron-transport", "nuclear-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Entry-point adapter discovery (axiom.compute.adapters lazy-loads on first
    # miss) lands in axiom-os-lm 0.15.0. Required for `axi model run --on
    # local:openmc` to work without manual `import axiom_ext_openmc`.
    "axiom-os-lm >= 0.15",
]

[project.urls]
Homepage = "https://github.com/UT-Computational-NE/axiom-ext-openmc"
Repository = "https://github.com/UT-Computational-NE/axiom-ext-openmc"

[project.optional-dependencies]
# HDF5 statepoint reading. OpenMC itself stays optional and is not imported.
statepoint = [
    "h5py >= 3.10",
]
test = [
    "pytest >= 7.0",
    "pytest-timeout >= 2.0",
    "h5py >= 3.10",
    # `axi ext lint` imports the MCP server while loading the ext command.
    "mcp >= 2",
    # AEOS schema + ExtensionStandardTests. Not published on PyPI; pinned to
    # the axiom-os commit whose spec this extension was audited against.
    "axiom-tests @ git+https://github.com/b-tree-labs/axiom-os.git@0216abc984c071ddf56f625ad7b8076ed34fe58d#subdirectory=packages/axiom-tests",
]
# OpenMC binary itself is NOT a Python dependency — it's a separate native install
# (conda install -c conda-forge openmc) or runs via Docker (openmc/openmc image).
# The adapter discovers the available runner at execute() time.

# AEOS adapter discovery — declaring under this group makes the OpenMC kernel
# available via `axi model run --on local:openmc` immediately after `pip install
# axiom-ext-openmc`, with no manual import required. axiom.compute.adapters
# discovers + registers via importlib.metadata.entry_points on first lookup miss.
[project.entry-points."axiom.compute.adapters"]
openmc = "axiom_ext_openmc.adapter:OpenMCKernelAdapter"

# AEOS kind=adapter. The label is the manifest `integration` value.
# `axi ext validate` checks this group, not axiom.compute.adapters.
[project.entry-points."axiom.adapters"]
openmc = "axiom_ext_openmc.adapters.openmc:OpenMCKernelAdapter"

[project.scripts]
axiom-openmc = "axiom_ext_openmc.commands.openmc:main"

# AEOS kind=cmd. `axi ext validate` checks this group, keyed by the manifest noun.
[project.entry-points."axiom.commands"]
openmc = "axiom_ext_openmc.commands.openmc:build_parser"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["axiom_ext_openmc"]

[tool.hatch.build.targets.wheel.force-include]
"axiom-extension.toml" = "axiom_ext_openmc/axiom-extension.toml"

[tool.pytest.ini_options]
testpaths = ["axiom_ext_openmc/tests", "tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "docker: tests that require Docker + the openmc/openmc image (opt-in via -m docker)",
    "slow: tests that take >1s to run (opt-in via -m slow)",
    "integration: AEOS integration-level conformance tests",
]
